<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<link rel="stylesheet" href="/theme.css"><style>
  * { box-sizing: border-box; }
  body { font-family: var(--body); margin: 0; background: var(--bg); color: #eee; }
  header { position: sticky; top: 0; z-index: 3; background: #000; border-bottom: 1px solid var(--line); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header b { flex: 1; font: 900 13px/1 var(--wide); letter-spacing: .14em; text-transform: uppercase; }
  header button { background: transparent; color: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font: 700 11px var(--wide); cursor: pointer; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  #login { max-width: 360px; margin: 16vh auto; padding: 24px; background: var(--panel); border-radius: 18px; border: 1px solid var(--line); }
  #login h2 { font: 400 44px/1 var(--script); }
  label { font: 500 10px/1.3 var(--wide); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  input, select { font: 400 16px var(--body); padding: 11px; border: 1px solid var(--line); border-radius: 10px; width: 100%; background: var(--field); color: #fff; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .btn { font: 700 12px/1.2 var(--wide); padding: 13px 18px; border: 0; border-radius: 999px; background: #fff; color: #000; cursor: pointer; }
  .btn.sm { font-size: 11px; padding: 8px 13px; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid var(--line); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .tile small { color: var(--dim); display: block; font: 500 10px/1.3 var(--wide); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .tile b { font: 900 22px var(--wide); }
  .tile.bad b { color: var(--bad); }
  nav { display: flex; gap: 6px; margin-bottom: 12px; }
  nav button { flex: 1; padding: 11px 6px; border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 999px; font: 700 11px var(--wide); cursor: pointer; }
  nav button.on { background: #fff; color: #000; border-color: #fff; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); vertical-align: top; }
  th { background: #0a0a0a; font: 500 10px/1.3 var(--wide); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font: 700 10px var(--wide); background: #222; color: #ccc; }
  .track { display: flex; gap: 3px; margin-top: 6px; } .dot { width: 18px; height: 5px; border-radius: 3px; background: #2a2a2a; } .dot.done { background: var(--ok); } .dot.cur { background: var(--warn); } .dot.red { background: var(--bad); }
  .stagenote { font-size: 12px; color: var(--dim); margin-top: 3px; } .stagenote.red { color: var(--bad); font-weight: 600; }
  .pill.ok { background: #0f2a1d; color: var(--ok); } .pill.warn { background: #2e2506; color: var(--warn); } .pill.bad { background: #36121a; color: var(--bad); }
  .err { color: var(--bad); } .muted { color: var(--dim); font-size: 13px; }
  .form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
  @media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
  td .small-in { width: 100%; min-width: 110px; padding: 7px; font-size: 14px; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-word; color: #cfcfcf; }
</style>
</head>
<body>
<div id="login">
  <h2 style="margin-top:0">Admin</h2>
  <label for="tok">Admin token</label>
  <input id="tok" type="password" autocomplete="current-password" style="margin:6px 0 12px">
  <button class="btn" id="enter" type="button" style="width:100%">Open</button>
  <p id="lmsg" class="err" role="alert"></p>
</div>

<div id="app" style="display:none">
  <header><b>Admin</b><span class="muted" id="upd"></span><button id="refresh" type="button">Refresh</button><button id="out" type="button">Log out</button></header>
  <main>
    <div class="tiles" id="tiles"></div>
    <nav id="tabs">
      <button data-t="orders" class="on">Orders</button>
      <button data-t="menu">Menu</button>
      <button data-t="riders">Riders</button>
      <button data-t="sms">SMS log</button>
      <button data-t="blocked">Blocked</button>
    </nav>
    <section id="t-orders">
      <form id="exportbar" class="tablewrap" style="padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:end">
        <label style="font-size:13px">From<br><input type="date" id="exf" required></label>
        <label style="font-size:13px">To<br><input type="date" id="ext" required></label>
        <button class="btn sm" type="submit" data-x="orders">Download orders (CSV)</button>
        <button class="btn sm ghost" type="submit" data-x="payouts">Download rider payouts (CSV)</button>
        <span id="exmsg" class="err" role="alert"></span>
      </form>
      <div id="ordersbody"></div>
    </section>
    <section id="t-menu" style="display:none"></section>
    <section id="t-riders" style="display:none"></section>
    <section id="t-sms" style="display:none"></section>
    <section id="t-blocked" style="display:none"></section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = ''; try { token = sessionStorage.getItem('adm') || ''; } catch {}
let data = { orders: [], menu: [], riders: [], sms: [], blocked: [], monitor: { ts: null }, shop: { open: true } }, timer = null;

async function call(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
}
const when = (t) => new Date(t).toLocaleString('en-KE', { timeZone: 'Africa/Nairobi', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const pill = (s) => {
  const cls = ['delivered', 'sent', 'mock'].includes(s) || s === 'assigned' ? 'ok' : s === 'paid' || s === 'awaiting_payment' ? 'warn' : /fail|mismatch|expired|blocked/.test(s) ? 'bad' : '';
  return `<span class="pill ${cls}">${esc(String(s).split(' ')[0])}</span>`;
};

// Order progress: 1 Awaiting payment > 2 Payment confirmed > 3 Awaiting rider > 4 Rider en route > 5 Completed
const STEPS = ['Awaiting payment', 'Payment confirmed', 'Awaiting rider', 'Rider en route', 'Order completed'];
const RIDER_WAIT_MS = 2 * 60 * 1000;
function stage(x) {
  const now = Date.now();
  if (x.status === 'awaiting_payment') return { step: 1, cls: 'warn', label: 'Awaiting payment', note: '' };
  if (['payment_failed', 'expired', 'amount_mismatch'].includes(x.status)) return { step: 1, cls: 'bad', red: true, label: { payment_failed: 'Payment failed', expired: 'Payment expired', amount_mismatch: 'Wrong amount paid' }[x.status], note: x.status === 'amount_mismatch' ? 'Check the M-Pesa receipt' : '' };
  if (x.status === 'paid') {
    const mins = Math.max(0, Math.floor((now - (x.paid_at || x.created_at)) / 60000));
    const available = data.riders.filter((r) => r.active && r.on_duty && !r.busy).length;
    if (!available && !x.offered_to) return { step: 3, cls: 'bad', red: true, label: 'Driver not found', note: 'No riders available. Waiting ' + mins + ' min' };
    if (now - (x.paid_at || x.created_at) > RIDER_WAIT_MS) return { step: 3, cls: 'bad', red: true, label: 'Rider yet to be found', note: 'Waiting ' + mins + ' min' + (x.offer_round ? ', round ' + (x.offer_round + 1) : '') };
    return { step: 3, cls: 'warn', label: 'Awaiting rider', note: x.offered_to ? 'Offer sent to a rider' : 'Finding a rider' };
  }
  if (x.status === 'cancelled') return { step: 1, cls: 'bad', label: 'Cancelled', note: 'Refund by hand if charged' };
  if (x.status === 'assigned') return { step: 4, cls: 'ok', label: 'Rider en route', note: x.rider_name ? esc(x.rider_name) : '' };
  if (x.status === 'delivered') return { step: 5, cls: 'ok', label: 'Order completed', note: x.delivered_at ? when(x.delivered_at) : '' };
  return { step: 0, cls: '', label: x.status, note: '' };
}
const progress = (x) => {
  const g = stage(x);
  const dots = STEPS.map((n, i) => `<span class="dot ${i + 1 < g.step || (i + 1 === g.step && g.step === 5) ? 'done' : i + 1 === g.step ? (g.red ? 'red' : 'cur') : ''}" title="${n}"></span>`).join('');
  return `<span class="pill ${g.cls}">${esc(g.label)}</span><div class="track" aria-label="Step ${g.step} of 5">${dots}</div>${g.note ? `<div class="stagenote ${g.red ? 'red' : ''}">${g.note}</div>` : ''}`;
};

async function load() {
  const [o, r, s, bl, mo, sh, mn] = await Promise.all([call('/api/admin/orders'), call('/api/admin/riders'), call('/api/admin/sms'), call('/api/admin/blocked'), call('/api/admin/monitor'), call('/api/admin/shop'), call('/api/admin/menu')]);
  if (o.status === 403) { logout('That token is not correct.'); return false; }
  data = { orders: o.j || [], riders: r.j || [], sms: s.j || [], blocked: bl.j || [], monitor: mo.j || { ts: null }, shop: sh.j || { open: true }, menu: Array.isArray(mn.j) ? mn.j : [] };
  $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString('en-KE', { timeZone: 'Africa/Nairobi', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  render();
  return true;
}

function shopTile() {
  const sh = data.shop;
  const label = sh.open ? 'Open' : (sh.reason === 'manual' ? 'Closed by you' : 'Closed (hours)');
  const btn = sh.reason === 'hours' ? '<small>Opens 8:00 am, closes midnight</small>' : `<button class="btn sm ghost" data-a="shop" data-closed="${sh.open ? 1 : 0}">${sh.open ? 'Close the shop now' : 'Reopen the shop'}</button>`;
  return `<div class="tile ${sh.open ? '' : 'bad'}"><small>Shop</small><b>${label}</b>${btn}</div>`;
}
function monitorTile() {
  const m = data.monitor;
  if (!m || !m.ts) return '<div class="tile"><small>Outside monitor</small><b style="color:var(--warn)">Not reporting yet</b><small>Add MONITOR_TOKEN, then run it once</small></div>';
  const mins = Math.round((Date.now() - m.ts) / 60000);
  const live = mins <= 15 && m.ok;
  return `<div class="tile ${live ? '' : 'bad'}"><small>Outside monitor</small><b>${live ? 'Live' : (m.ok ? 'Quiet' : 'Problem')}</b><small>${mins < 1 ? 'just now' : mins + ' min ago'}${m.ok ? '' : ': ' + esc(m.detail)}</small></div>`;
}

function render() {
  const day = Date.now() - 24 * 3600 * 1000;
  const paidOrders = data.orders.filter((x) => ['paid', 'assigned', 'delivered'].includes(x.status));
  const paid24 = paidOrders.filter((x) => x.created_at > day);
  const stuck = data.orders.filter((x) => stage(x).red).length;
  const smsBad = data.sms.filter((m) => !['sent', 'mock'].includes(m.status) && m.created_at > day).length;
  const owed = data.riders.reduce((a, r) => a + (r.owed_kes || 0), 0);
  $('tiles').innerHTML = `
    <div class="tile"><small>Paid orders, 24h</small><b>${paid24.length}</b></div>
    <div class="tile"><small>Paid value, 24h</small><b>KSh ${paid24.reduce((a, x) => a + x.total_kes, 0)}</b></div>
    <div class="tile ${stuck ? 'bad' : ''}"><small>Need attention</small><b>${stuck}</b></div>
    <div class="tile ${smsBad ? 'bad' : ''}"><small>Failed or blocked SMS, 24h</small><b>${smsBad}</b></div>
    <div class="tile"><small>Owed to riders</small><b>KSh ${owed}</b></div>
    ${shopTile()}
    ${monitorTile()}`;

  if (!menuDirty) renderMenu();
  $('ordersbody').innerHTML = `<div class="tablewrap"><table><thead><tr><th>When</th><th>Order</th><th>Status</th><th>Item</th><th>Paid with</th><th>Customer</th><th>Where</th><th>Rider</th><th></th></tr></thead><tbody>${
    data.orders.map((x) => `<tr><td>${when(x.created_at)}</td><td class="mono">${esc(x.id)}</td><td>${progress(x)}</td><td>${esc(x.product)} x ${x.qty}<br><b>KSh ${x.total_kes}</b></td><td>${esc(x.provider === 'airtel' ? 'Airtel Money' : 'M-Pesa')}</td><td>+${esc(x.phone)}</td><td>${esc(x.address)}${x.lat != null ? `<br><a href="https://maps.google.com/?q=${x.lat},${x.lng}" target="_blank" rel="noopener">Map pin</a>` : ''}</td><td>${x.rider_id ? esc(x.rider_name || '#' + x.rider_id) : ''}</td><td style="white-space:nowrap">${(x.status === 'assigned' || x.status === 'paid') ? `<button class="btn sm ghost" data-a="reassign" data-id="${esc(x.id)}">Reassign</button> <button class="btn sm ghost" data-a="cancelorder" data-id="${esc(x.id)}">Cancel</button> ` : ''}${data.blocked.some((z) => z.phone === x.phone) ? '<span class="pill bad">blocked</span>' : `<button class="btn sm ghost" data-a="block" data-p="${esc(x.phone)}">Block</button>`}</td></tr>`).join('') || '<tr><td colspan="9" class="muted">No orders yet.</td></tr>'
  }</tbody></table></div>`;

  $('t-riders').innerHTML = `<form class="form" id="addr"><input id="rn" placeholder="Rider name" maxlength="40" required><input id="rp" placeholder="Phone, e.g. 0712 345 678" inputmode="tel" required><button class="btn" type="submit">Add rider</button></form><p id="rmsg" class="err" role="alert"></p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Status</th><th>Owed</th><th></th></tr></thead><tbody>${
    data.riders.map((r) => `<tr data-id="${r.id}"><td>${r.id}</td><td><input class="small-in" data-f="name" value="${esc(r.name)}"></td><td><input class="small-in" data-f="phone" value="+${esc(r.phone)}" inputmode="tel"></td><td>${!r.active ? '<span class="pill">suspended</span>' : (!r.on_duty ? '<span class="pill">rider off duty</span>' : (r.busy ? '<span class="pill warn">on a delivery</span>' : '<span class="pill ok">free</span>'))}</td><td>KSh ${r.owed_kes}</td><td style="white-space:nowrap"><button class="btn sm" data-a="save">Save</button> <button class="btn sm ghost" data-a="toggle">${r.active ? 'Suspend' : 'Reinstate'}</button> <button class="btn sm ghost" data-a="link">Copy link</button> <button class="btn sm ghost" data-a="reset">New link</button> <button class="btn sm ghost" data-a="settle" ${r.owed_kes ? '' : 'disabled'}>Mark paid out</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No riders.</td></tr>'
  }</tbody></table></div><p class="muted">Each rider has a private page (Copy link, then send it to them once). New link cancels the old one. Rider mode is a demo for now: every paid order goes to rider #1 whatever their status.</p>`;

  $('t-blocked').innerHTML = `<p class="muted">Blocked numbers cannot place orders. The number is matched in any format (0712..., +254712..., 254712...).</p>
    <form class="form" id="addb"><input id="bp" placeholder="Phone, e.g. 0712 345 678" inputmode="tel" required><input id="br" placeholder="Reason (only you see this)" maxlength="120"><button class="btn" type="submit">Block</button></form><p id="bmsg" class="err" role="alert"></p>
    <div class="tablewrap"><table><thead><tr><th>Phone</th><th>Reason</th><th>Since</th><th></th></tr></thead><tbody>${
    data.blocked.map((x) => `<tr><td>+${esc(x.phone)}</td><td>${esc(x.reason)}</td><td>${when(x.created_at)}</td><td><button class="btn sm ghost" data-a="unblock" data-p="${esc(x.phone)}">Unblock</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nobody is blocked.</td></tr>'
  }</tbody></table></div>`;

  $('t-sms').innerHTML = `<p class="muted">Newest first. "sent" means Africa's Talking accepted it. Anything else needs a look.</p><div class="tablewrap"><table><thead><tr><th>When</th><th>To</th><th>Result</th><th>Message</th></tr></thead><tbody>${
    data.sms.map((m) => `<tr><td>${when(m.created_at)}</td><td>+${esc(m.to_phone)}</td><td>${pill(m.status)}${m.attempts > 1 ? ' <span class="muted">try ' + m.attempts + '</span>' : ''}<div class="muted">${esc(m.status.length > 12 ? m.status : '')}</div></td><td>${esc(m.body)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No messages yet.</td></tr>'
  }</tbody></table></div>`;
}

// ----- Menu -----
let menuDirty = false;
function renderMenu() {
  const card = (f) => `<div class="tablewrap" style="padding:12px;margin-bottom:12px" data-f="${f.id}">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end">
      <label style="font-size:13px">Flavor<br><input data-k="name" value="${esc(f.name)}" maxlength="40"></label>
      <label style="font-size:13px;flex:1;min-width:160px">Short description<br><input data-k="blurb" value="${esc(f.blurb)}" maxlength="120" style="width:100%"></label>
      <label style="font-size:13px">Colour<br><input data-k="color" type="color" value="${esc(f.color)}"></label>
      <button class="btn sm" type="button" data-m="saveflavor">Save</button>
      <button class="btn sm ghost" type="button" data-m="toggleflavor" data-on="${f.active ? 1 : 0}">${f.active ? 'Hide from shop' : 'Show in shop'}</button>
      ${f.active ? '' : '<span class="pill bad">hidden</span>'}
    </div>
    <table style="margin-top:8px"><thead><tr><th>Size</th><th>Price (KSh)</th><th></th></tr></thead><tbody>${f.products.map((p) => `<tr data-p="${p.id}"><td>${esc(p.size)}${p.active ? '' : ' <span class="pill bad">hidden</span>'}</td><td><input data-k="price" type="number" min="10" max="50000" step="1" value="${p.price_kes}" style="width:110px"></td><td style="white-space:nowrap"><button class="btn sm" type="button" data-m="saveprice">Save</button> <button class="btn sm ghost" type="button" data-m="toggleproduct" data-on="${p.active ? 1 : 0}">${p.active ? 'Hide' : 'Show'}</button></td></tr>`).join('')}
      <tr data-addsize="${f.id}"><td><input data-k="size" placeholder="New size, e.g. 250g" maxlength="20" style="width:150px"></td><td><input data-k="price" type="number" min="10" max="50000" step="1" placeholder="Price" style="width:110px"></td><td><button class="btn sm ghost" type="button" data-m="addsize">Add size</button></td></tr>
    </tbody></table></div>`;
  $('t-menu').innerHTML = `<p class="muted">Changes apply to new orders straight away. Orders already placed keep the price they were charged. A hidden flavor or size disappears from the shop but stays here.</p>
    ${data.menu.length ? data.menu.map(card).join('') : '<p class="muted">No flavors yet. Add the first one below.</p>'}
    <div class="tablewrap" style="padding:12px" id="newflavor"><b>Add a new flavor</b>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:6px">
        <label style="font-size:13px">Name<br><input data-k="name" maxlength="40"></label>
        <label style="font-size:13px;flex:1;min-width:160px">Short description<br><input data-k="blurb" maxlength="120" style="width:100%"></label>
        <label style="font-size:13px">Colour<br><input data-k="color" type="color" value="#444444"></label>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:6px">
        <label style="font-size:13px">Size 1<br><input data-k="s1" value="sample" maxlength="20" style="width:130px"></label>
        <label style="font-size:13px">Price<br><input data-k="p1" type="number" min="10" max="50000" style="width:100px"></label>
        <label style="font-size:13px">Size 2 (optional)<br><input data-k="s2" value="packet" maxlength="20" style="width:130px"></label>
        <label style="font-size:13px">Price<br><input data-k="p2" type="number" min="10" max="50000" style="width:100px"></label>
        <button class="btn sm" type="button" data-m="newflavor">Add flavor</button>
      </div>
      <p id="menumsg" class="err" role="alert"></p></div>`;
  menuDirty = false;
}
$('t-menu').addEventListener('input', () => { menuDirty = true; });
$('t-menu').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  const card = b.closest('[data-f]'), row = b.closest('[data-p]'), v = (root, k) => root.querySelector(`[data-k=${k}]`).value;
  const fail = (msg) => { if (b.dataset.m === 'newflavor') $('menumsg').textContent = msg; else alert(msg); };
  b.disabled = true; let r;
  const m = b.dataset.m;
  if (m === 'saveflavor') r = await call(`/api/admin/menu/flavor/${card.dataset.f}`, { name: v(card, 'name'), blurb: v(card, 'blurb'), color: v(card, 'color') });
  else if (m === 'toggleflavor') {
    if (b.dataset.on === '1' && !confirm('Hide this flavor from the shop? Customers will not be able to order it.')) { b.disabled = false; return; }
    r = await call(`/api/admin/menu/flavor/${card.dataset.f}`, { active: b.dataset.on === '1' ? 0 : 1 });
  }
  else if (m === 'saveprice') r = await call(`/api/admin/menu/product/${row.dataset.p}`, { price_kes: Number(v(row, 'price')) });
  else if (m === 'toggleproduct') r = await call(`/api/admin/menu/product/${row.dataset.p}`, { active: b.dataset.on === '1' ? 0 : 1 });
  else if (m === 'addsize') { const ar = b.closest('[data-addsize]'); r = await call(`/api/admin/menu/flavor/${ar.dataset.addsize}/size`, { size: v(ar, 'size'), price_kes: Number(v(ar, 'price')) }); }
  else if (m === 'newflavor') {
    const nf = $('newflavor'), sizes = [{ size: v(nf, 's1'), price_kes: Number(v(nf, 'p1')) }];
    if (v(nf, 's2').trim() || v(nf, 'p2')) sizes.push({ size: v(nf, 's2'), price_kes: Number(v(nf, 'p2')) });
    r = await call('/api/admin/menu/flavor', { name: v(nf, 'name'), blurb: v(nf, 'blurb'), color: v(nf, 'color'), sizes });
  }
  if (!r || !r.ok) { b.disabled = false; fail((r && r.j && r.j.error) || 'That did not work.'); return; }
  menuDirty = false; await load(); document.querySelector('#tabs [data-t=menu]').click();
});

// ----- Export -----
(() => {
  const nairobi = (d) => new Date(d.getTime() + 3 * 3600e3).toISOString().slice(0, 10);
  $('ext').value = nairobi(new Date()); $('exf').value = nairobi(new Date(Date.now() - 6 * 86400e3));
  $('exportbar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const type = e.submitter && e.submitter.dataset.x === 'payouts' ? 'payouts' : 'orders', from = $('exf').value, to = $('ext').value;
    $('exmsg').textContent = '';
    const r = await fetch(`/api/admin/export?type=${type}&from=${from}&to=${to}`, { headers: { authorization: 'Bearer ' + token } });
    if (!r.ok) { const j = await r.json().catch(() => ({})); $('exmsg').textContent = j.error || 'Could not make the file.'; return; }
    const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = (type === 'payouts' ? 'rider-payouts-' : 'orders-') + from + '_to_' + to + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
})();

$('tabs').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  for (const t of ['orders', 'menu', 'riders', 'sms', 'blocked']) $('t-' + t).style.display = t === b.dataset.t ? '' : 'none';
};

document.addEventListener('submit', async (e) => {
  if (e.target.id === 'addb') {
    e.preventDefault();
    const r = await call('/api/admin/blocked', { phone: $('bp').value, reason: $('br').value });
    if (!r.ok) { $('bmsg').textContent = r.j.error || 'Could not block that number.'; return; }
    await load(); document.querySelector('#tabs [data-t=blocked]').click(); return;
  }
  if (e.target.id !== 'addr') return;
  e.preventDefault();
  const r = await call('/api/admin/riders', { name: $('rn').value, phone: $('rp').value });
  if (!r.ok) { $('rmsg').textContent = r.j.error || 'Could not add the rider.'; return; }
  await load(); document.querySelector('#tabs [data-t=riders]').click();
});

document.addEventListener('click', async (e) => {
  const sb = e.target.closest('button[data-a=shop]');
  if (sb) { const close = sb.dataset.closed === '1'; if (close && !confirm('Stop taking orders now? Customers will see a closed message until you reopen.')) return; sb.disabled = true; await call('/api/admin/shop', { closed: close }); await load(); return; }
  const b = e.target.closest('button[data-a]'); if (!b) return;
  if (b.dataset.a === 'reassign' || b.dataset.a === 'cancelorder') {
    const id = b.dataset.id, o = data.orders.find((z) => z.id === id), cancel = b.dataset.a === 'cancelorder';
    if (!confirm(cancel ? `Cancel order ${id}? The customer paid KSh ${o.total_kes}. You must refund +${o.phone} by hand.` : `Take order ${id} away from its rider and offer it to the others?`)) return;
    b.disabled = true;
    const r = await call(`/api/admin/orders/${id}/${cancel ? 'cancel' : 'reassign'}`, {});
    if (!r.ok) alert(r.j.error || 'That did not work.');
    else if (cancel && r.j.refund) alert(`Cancelled. Refund KSh ${r.j.refund.amount_kes} to +${r.j.refund.phone}` + (r.j.refund.receipt ? ` (M-Pesa receipt ${r.j.refund.receipt}).` : '.'));
    await load(); return;
  }
  if (b.dataset.a === 'block' || b.dataset.a === 'unblock') {
    const ph = b.dataset.p;
    if (b.dataset.a === 'block' && !confirm('Block +' + ph + ' from ordering?')) return;
    b.disabled = true;
    const r = b.dataset.a === 'block' ? await call('/api/admin/blocked', { phone: ph, reason: 'Blocked from the orders list' }) : await call('/api/admin/blocked/' + encodeURIComponent(ph) + '/remove', {});
    if (!r.ok) alert(r.j.error || 'That did not work.');
    await load(); return;
  }
  const tr = b.closest('tr'), id = tr.dataset.id, rider = data.riders.find((x) => String(x.id) === id);
  b.disabled = true;
  let r;
  if (b.dataset.a === 'save') r = await call(`/api/admin/riders/${id}/update`, { name: tr.querySelector('[data-f=name]').value, phone: tr.querySelector('[data-f=phone]').value });
  if (b.dataset.a === 'toggle') r = await call(`/api/admin/riders/${id}/update`, { active: rider.active ? 0 : 1 });
  if (b.dataset.a === 'link') { try { await navigator.clipboard.writeText(rider.link); alert('Link copied. Send it to ' + rider.name + ' only.'); } catch { prompt('Copy this link and send it to ' + rider.name + ' only:', rider.link); } b.disabled = false; return; }
  if (b.dataset.a === 'reset') { if (!confirm('Make a new link for ' + rider.name + '? Their old link stops working.')) { b.disabled = false; return; } r = await call(`/api/admin/riders/${id}/reset-link`, {}); if (r.ok) { await load(); prompt('New link for ' + rider.name + ' (send it to them):', r.j.link); document.querySelector('#tabs [data-t=riders]').click(); return; } }
  if (b.dataset.a === 'settle') { if (!confirm('Mark KSh ' + rider.owed_kes + ' as paid out to ' + rider.name + '? Do this only after you have sent the money.')) { b.disabled = false; return; } r = await call(`/api/admin/riders/${id}/settle`, {}); }
  if (r && !r.ok) { alert(r.j.error || 'That did not work.'); }
  await load(); document.querySelector('#tabs [data-t=riders]').click();
});

function logout(msg) {
  try { sessionStorage.removeItem('adm'); } catch {}
  token = ''; clearInterval(timer);
  $('app').style.display = 'none'; $('login').style.display = ''; $('lmsg').textContent = msg || '';
}
async function enter() {
  token = $('tok').value.trim() || token;
  if (!token) { $('lmsg').textContent = 'Enter the admin token.'; return; }
  if (await load()) {
    try { sessionStorage.setItem('adm', token); } catch {}
    $('login').style.display = 'none'; $('app').style.display = ''; $('tok').value = '';
    clearInterval(timer); timer = setInterval(() => { if (!document.hidden && !document.activeElement.closest('td,.form')) load(); }, 15000);
  }
}
$('enter').onclick = enter;
$('tok').onkeydown = (e) => { if (e.key === 'Enter') enter(); };
$('refresh').onclick = load;
$('out').onclick = () => logout('');
if (token) enter();
</script>
</body>
</html>
