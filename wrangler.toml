name = "fortwenty"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "shisha-store-db"
database_id = "54bc5359-dbc4-4047-97aa-deec768b69a2"

# Per-visitor request limit on the public API (a Cloudflare Workers rate limiter, no dashboard rule needed).
# 120 requests per minute per visitor address, counted separately in each Cloudflare location.
[[ratelimits]]
name = "RL_API"
namespace_id = "7041"
  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

# Non-secret settings. Secrets (ADMIN_TOKEN, CALLBACK_SECRET, DARAJA_* keys, AT_API_KEY)
# go in .dev.vars locally and in `wrangler secret put` for production.
[vars]
PAYMENTS_MODE = "daraja"      # "mock" until the real Till and Daraja approval exist, then "daraja"
SMS_MODE = "mock" # demo: texts are only recorded in the SMS log. Switch to "at" for live (see SMS_ALLOWLIST)
DARAJA_ENV = "sandbox"
AIRTEL_ENV = "sandbox"        # "production" once Airtel approves the live collection account
RIDER_MODE = "offers"         # live: paid orders are OFFERED to on-duty riders (accept/decline, 2-minute window). "demo" = auto-pass to rider 1; "real" = instant assignment, no accept
ENABLED_PROVIDERS = "mpesa"  # Airtel hidden until the client has an Airtel merchant account: use "mpesa,airtel" to show it
AT_ENV = "live"               # "sandbox" = AT test servers (nothing reaches phones); "live" = real texts, needs a funded account
SMS_ALLOWLIST = "254702581356,254712601406,254117795777,254794297971,254781812133,254757372270" # while payments are a demo, ONLY these numbers get real SMS. Delete this line when real payments go live
ALERT_PHONES = "254702581356" # down and no-rider alerts; client's number is added when provided
RIDER_CUT_PCT = "10"          # only used for old orders with no delivery fee. The rider is paid the delivery fee
SHOP_LAT = "-0.1671"          # Kabarak University (the centre of the delivery area)
SHOP_LNG = "35.9660"
# TESTING: delivery is free for now. To turn delivery fees back on, restore base 50, per-km 25, min 100 and fallback 150.
DELIVERY_BASE_KES = "0"       # (live: "50") delivery fee = base + per-km x road distance, rounded up to the next 10, at least the minimum.
DELIVERY_PER_KM_KES = "0"     # (live: "25") ESTIMATE, to be checked against what a Nakuru rider would quote
DELIVERY_MIN_KES = "0"        # (live: "100")
DELIVERY_ROUND_KES = "10"
ROAD_FACTOR = "1.3"           # road distance is about 1.3x the straight line
DELIVERY_FALLBACK_KES = "0"   # (live: "150") flat fee when the customer gives no map pin
DELIVERY_MAX_KM = "3"         # farther than this, in a straight line from Kabarak, is refused
OPEN_HOUR = "8"               # orders start at 8:00 am Nairobi time
CLOSE_HOUR = "24"             # orders stop at midnight (24)
# WhatsApp: "mock" only records messages in wa_log. "cloud" sends through Meta's WhatsApp Business Cloud API (needs the secrets WA_TOKEN, WA_VERIFY_TOKEN, WA_APP_SECRET).
WHATSAPP_MODE = "mock"
WHATSAPP_NUMBER = "254794297971" # the shop's WhatsApp number with country code, digits only, e.g. 2547XXXXXXXX. Empty hides the WhatsApp icon
WA_PHONE_NUMBER_ID = ""       # from Meta: WhatsApp > API setup > Phone number ID
WA_TEMPLATE = "order_update"  # approved utility template with ONE body variable {{1}}, used outside the 24-hour reply window
WA_TEMPLATE_LANG = "en"
# WA_ALLOWLIST = ""           # while testing, set a comma-separated list: only these numbers get real WhatsApp messages
PUBLIC_URL = "https://fortwenty.kipp-ralph.workers.dev"
